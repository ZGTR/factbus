# Local engines for the integration suite and the end-to-end example.
#
#   docker compose up -d --wait
#   export FACTBUS_PG_URL=postgresql+psycopg://factbus:factbus@localhost:5442/factbus
#   export FACTBUS_MYSQL_URL=mysql+pymysql://factbus:factbus@localhost:3316/factbus
#   export LOCALSTACK_ENDPOINT=http://localhost:4566
#
# LocalStack is pinned to 3.8 by digest: the last Community line this kit was measured
# against, and it needs no auth token. Newer LocalStack images need an account; the kit
# never requires LocalStack (unit tests use moto and in-memory doubles).
name: factbus

services:
  localstack:
    image: localstack/localstack:3.8@sha256:b279c01f4cfb8f985a482e4014cabc1e2697b9d7a6c8c8db2e40f4d9f93687c7
    environment:
      SERVICES: "${LOCALSTACK_SERVICES:-events,sqs,dynamodb,lambda,iam,sts,logs,cloudwatch}"
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "${FACTBUS_LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: factbus
      POSTGRES_PASSWORD: factbus
      POSTGRES_DB: factbus
    mem_limit: 512m
    ports:
      - "${FACTBUS_POSTGRES_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factbus -d factbus"]
      interval: 3s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.0.46
    environment:
      MYSQL_ROOT_PASSWORD: factbus
      MYSQL_USER: factbus
      MYSQL_PASSWORD: factbus
      MYSQL_DATABASE: factbus
    mem_limit: 768m
    ports:
      - "${FACTBUS_MYSQL_PORT:-3316}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ufactbus -pfactbus --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
